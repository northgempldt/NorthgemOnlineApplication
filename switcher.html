<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switcher Application</title>
    <link rel="icon" type="image/png" href="images/loogoo.png">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
        }

        header {
            background: #cb0404;
            color: #fff;
            padding: 18px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        h2 {
            color: #cb0404;
            margin-top: 24px;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }

        .attach {
            border: 2px dashed #bbb;
            padding: 18px;
            border-radius: 8px;
            background: #fafafa;
        }

        .attach div.upload-group {
            margin-bottom: 20px;
        }

        .attach div.upload-group:last-child {
            margin-bottom: 0;
        }

        /* Stacked File List Styles */
        .file-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
        }

        .file-item span {
            word-break: break-all;
            padding-right: 10px;
        }

        .remove-file-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        .btn,
        button {
            display: inline-block;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin: 5px;
            text-decoration: none;
        }

        .home {
            background: #0d6efd;
            color: #fff;
        }

        .submit {
            background: #cb0404;
            color: #fff;
        }

        .reset {
            background: #777;
            color: #fff;
        }

        /* --- Modal Popup Styling --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            text-align: center;
            border-bottom: 2px solid #28a745;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            color: #28a745;
            margin: 0;
            border: none;
            font-size: 24px;
        }

        .summary-section {
            margin-bottom: 15px;
        }

        .summary-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }

        .summary-item {
            word-break: break-word;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #cb0404;
        }

        .summary-item strong {
            color: #333;
        }

        .close-btn {
            background: #28a745;
            color: #fff;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>PLDT Northgem - Switcher Application</h1>
    </header>
    <div class="container">
        <form id="appForm">
            <h2>Subscription Details</h2>
            <div class="grid">
                <div>
                    <label>Plan</label>
                    <select id="plan" required>
                        <option value="">--Select Plan--</option>
                        <option>Switcher-Fiber Unli Plan 1299</option>
                        <option>Switcher-Fiber Unli Plan 1699</option>
                        <option>Switcher-Fiber Unli Plan 2099</option>
                        <option>Switcher-Fiber Unli All Plan 1499</option>
                        <option>Switcher-Fiber Unli All Plan 1899</option>
                        <option>Switcher-Fiber Unli All Plan 2599</option>
                        <option>Switcher-Fiber Netflix Plan 1599</option>
                    </select>
                </div>
                <div>
                    <label>Agent Name</label>
                    <input id="agentName" required>
                </div>
            </div>

            <h2>Personal Information</h2>
            <div class="grid">
                <div><label>First Name</label><input id="firstName" required></div>
                <div><label>Middle Name</label><input id="middleName"></div>
                <div><label>Last Name</label><input id="lastName" required></div>
                <div><label>Email Address</label><input id="email" type="email" required></div>
            </div>

            <h2>Complete Address</h2>
            <div class="grid">
                <div class="full">
                    <label>House Number / Street / Subdivision</label>
                    <input id="address" required>
                </div>
                <div><label>Barangay</label><input id="barangay" required></div>
                <div><label>City / Municipality</label><input id="city" required></div>
                <div class="full"><label>Province</label><input id="province" required></div>
                <div class="full">
                    <label>Landmark/Time Availability</label>
                    <textarea id="landmark" placeholder="Enter landmark details..."></textarea>
                </div>
            </div>

            <h2>Attachments</h2>
            <div class="attach">
                <div class="upload-group">
                    <label>Valid ID & SOA (Front ID, Back ID, Selfie with ID, and Selfie with SOA)</label>
                    <input id="idUpload" type="file" accept=".jpg,.jpeg,.png,.pdf" multiple>
                    <div id="idFileList" class="file-list"></div>
                </div>
                <div class="upload-group">
                    <label>Supporting Documents including SOA</label>
                    <input id="supportUpload" type="file" accept=".jpg,.jpeg,.png,.pdf" multiple>
                    <div id="supportFileList" class="file-list"></div>
                </div>
            </div>

            <div class="buttons">
                <a class="btn home" href="index.html">Back to Home</a>
                <button type="submit" class="submit">Submit Application</button>
                <button type="reset" class="reset">Reset</button>
            </div>
        </form>
    </div>

    <!-- Summary Modal Popup -->
    <div id="summaryModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Submitted!</h2>
                <p style="margin: 5px 0 0 0; color: #555;">Switcher application successfully submitted.</p>
            </div>

            <div id="summaryDetails" class="summary-section">
                <!-- Data dynamically inserted here -->
            </div>

            <button class="close-btn" onclick="closeSummaryModal()">Done / Close</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynHHA0VYmn0xg3dSd0PMzY3B3rv6zGptVTxcNMSqeGKiZoeHnLO1Fe077hv1C-Ce4H/exec';

        // Global arrays to stack accumulative file objects
        let idFilesArray = [];
        let supportFilesArray = [];

        // File Selection Listener for ID Files Stack
        document.getElementById('idUpload').addEventListener('change', function () {
            Array.from(this.files).forEach(file => idFilesArray.push(file));
            this.value = ''; // Reset input
            renderFileList('idFileList', idFilesArray, removeIdFile);
        });

        // File Selection Listener for Supporting Files Stack
        document.getElementById('supportUpload').addEventListener('change', function () {
            Array.from(this.files).forEach(file => supportFilesArray.push(file));
            this.value = ''; // Reset input
            renderFileList('supportFileList', supportFilesArray, removeSupportFile);
        });

        // Render stacked files UI list
        function renderFileList(containerId, fileArray, removeCallback) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            fileArray.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';

                const fileNameSpan = document.createElement('span');
                fileNameSpan.textContent = `${index + 1}. ${file.name}`;

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'remove-file-btn';
                removeBtn.innerHTML = '&#10005;';
                removeBtn.onclick = () => removeCallback(index);

                item.appendChild(fileNameSpan);
                item.appendChild(removeBtn);
                container.appendChild(item);
            });
        }

        // Functions to remove individual files from stacks
        function removeIdFile(index) {
            idFilesArray.splice(index, 1);
            renderFileList('idFileList', idFilesArray, removeIdFile);
        }

        function removeSupportFile(index) {
            supportFilesArray.splice(index, 1);
            renderFileList('supportFileList', supportFilesArray, removeSupportFile);
        }

        // Convert file object to Base64 data URL
        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({ name: file.name, data: reader.result });
            reader.onerror = error => reject(error);
        });

        // Display summary modal with ONLY Plan, Agent Name, and Full Name (First, Middle, Last)
        function showSummaryModal(data) {
            const container = document.getElementById('summaryDetails');
            const toUpper = str => str ? String(str).trim().toUpperCase() : '';

            // Construct Full Name: FIRST MIDDLE LAST
            const fullNameParts = [
                toUpper(data.firstName),
                toUpper(data.middleName),
                toUpper(data.lastName)
            ].filter(Boolean); // Filters out blank strings if Middle Name is empty

            const fullName = fullNameParts.join(' ');

            container.innerHTML = `
                <div class="summary-list">
                    <div class="summary-item">
                        <strong>Plan:</strong> ${toUpper(data.plan)}
                    </div>
                    <div class="summary-item">
                        <strong>Agent Name:</strong> ${toUpper(data.agentName)}
                    </div>
                    <div class="summary-item">
                        <strong>Full Name:</strong> ${fullName || 'N/A'}
                    </div>
                </div>
            `;

            document.getElementById('summaryModal').style.display = 'flex';
        }

        // Reset form handling
        document.getElementById('appForm').addEventListener('reset', function () {
            idFilesArray = [];
            supportFilesArray = [];
            renderFileList('idFileList', idFilesArray, removeIdFile);
            renderFileList('supportFileList', supportFilesArray, removeSupportFile);
        });

        // Close summary modal and reset form
        function closeSummaryModal() {
            document.getElementById('summaryModal').style.display = 'none';
            document.getElementById('appForm').reset();
        }

        // Submit listener to process data and send to Apps Script
        document.getElementById('appForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = document.querySelector('.submit');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing & Submitting...';

            try {
                const idFiles = await Promise.all(idFilesArray.map(fileToBase64));
                const supportFiles = await Promise.all(supportFilesArray.map(fileToBase64));

                const formData = {
                    plan: document.getElementById('plan').value,
                    agentName: document.getElementById('agentName').value,
                    firstName: document.getElementById('firstName').value,
                    middleName: document.getElementById('middleName').value,
                    lastName: document.getElementById('lastName').value,
                    email: document.getElementById('email').value,
                    address: document.getElementById('address').value,
                    barangay: document.getElementById('barangay').value,
                    city: document.getElementById('city').value,
                    province: document.getElementById('province').value,
                    landmark: document.getElementById('landmark').value,
                    idFiles: idFiles,
                    supportFiles: supportFiles
                };

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify(formData)
                });

                showSummaryModal(formData);

            } catch (err) {
                alert('An error occurred during submission: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Application';
            }
        });
    </script>
</body>

</html>
