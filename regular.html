<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Regular Application</title>
    <link rel="icon" type="image/png" href="images/loogoo.png">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
        }

        header {
            background: #cb0404;
            color: #fff;
            padding: 18px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        h2 {
            color: #cb0404;
            margin-top: 24px;
            margin-bottom: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }

        .attach {
            border: 2px dashed #bbb;
            padding: 18px;
            border-radius: 8px;
            background: #fafafa;
        }

        .attach div.upload-group {
            margin-bottom: 20px;
        }

        .attach div.upload-group:last-child {
            margin-bottom: 0;
        }

        /* Stacked File List Styles */
        .file-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
        }

        .file-item span {
            word-break: break-all;
            padding-right: 10px;
        }

        .remove-file-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button,
        a.btn {
            display: inline-block;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            font-size: 14px;
        }

        .submit {
            background: #cb0404;
            color: #fff;
        }

        .reset {
            background: #777;
            color: #fff;
        }

        .home {
            background: #0d6efd;
            color: #fff;
        }

        /* Custom Modal Popup Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #28a745;
            padding-bottom: 12px;
        }

        .modal-header h2 {
            color: #28a745;
            margin: 0;
            border: none;
            font-size: 28px;
            font-weight: bold;
            padding-bottom: 0;
        }

        .modal-header p {
            margin: 8px 0 0 0;
            color: #555;
            font-size: 16px;
        }

        .section-title {
            color: #b30000;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            margin-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 4px;
        }

        .detail-row {
            margin-bottom: 8px;
            font-size: 14px;
            color: #333;
            line-height: 1.4;
        }

        .detail-row strong {
            font-weight: bold;
            color: #111;
        }

        .close-btn {
            background: #28a745;
            color: #ffffff;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .close-btn:hover {
            background: #218838;
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Regular / HBBS Application</h1>
    </header>
    <div class="container">
        <form id="appForm">
            <h2>Subscription</h2>
            <div class="grid">
                <div>
                    <label>Plan</label>
                    <select id="plan" required>
                        <option value="">--Select Plan--</option>
                        <option>Fiber Plan 999</option>
                        <option>Fiber Unli Plan 1299</option>
                        <option>Fiber Unli Plan 1699</option>
                        <option>Fiber Unli Plan 2099</option>
                        <option>Fiber Unli All Plan 1499</option>
                        <option>Fiber Unli All Plan 1899</option>
                        <option>Fiber Unli All Plan 2599</option>
                        <option>Fiber Netflix Plan 1599</option>
                    </select>
                </div>
                <div>
                    <label>Agent Name</label>
                    <input id="agentName" required>
                </div>
            </div>

            <h2>Personal Information</h2>
            <div class="grid">
                <div><label>First Name</label><input id="firstName" required></div>
                <div><label>Middle Name</label><input id="middleName" placeholder="LIKDANGAN kung wala..."></div>
                <div><label>Last Name</label><input id="lastName" required></div>
                <div><label>Email Address</label><input id="email" type="email" required></div>
            </div>

            <h2>Complete Address</h2>
            <div class="grid">
                <div class="full">
                    <label>House Number / Street / Subdivision</label>
                    <input id="address" required>
                </div>
                <div><label>Barangay</label><input id="barangay" required></div>
                <div><label>City / Municipality</label><input id="city" required></div>
                <div class="full"><label>Province</label><input id="province" required></div>
                <div class="full">
                    <label>Landmark/Time availability</label>
                    <textarea id="landmark" rows="3" placeholder="Enter landmark details..."></textarea>
                </div>
            </div>

            <h2>Attachments</h2>
            <div class="attach">
                <div class="upload-group">
                    <label>Valid ID (Upload Front, Back, and Selfie with ID)</label>
                    <input id="idUpload" type="file" accept=".jpg,.jpeg,.png" multiple>
                    <div id="idFileList" class="file-list"></div>
                </div>
                <div class="upload-group">
                    <label>Supporting Documents (CAF, Subcert, Cignal Consent, etc.)</label>
                    <input id="supportUpload" type="file" accept=".jpg,.jpeg,.png" multiple>
                    <div id="supportFileList" class="file-list"></div>
                </div>
            </div>

            <div class="buttons">
                <a class="btn home" href="index.html">Back to Home</a>
                <button class="submit" type="submit">Submit Application</button>
                <button class="reset" type="reset">Reset</button>
            </div>
        </form>
    </div>

    <!-- Summary Modal Popup -->
    <div id="summaryModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✅ Sakses!</h2>
                <p>Application Submitted.</p>
            </div>

            <div id="summaryDetails">
                <!-- Dynamic summary details injected here -->
            </div>

            <button class="close-btn" onclick="closeSummaryModal()">Done</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbvnWikB2Dkh0_PEhEvQu_nX2BGQIx5MbcF4OcD2gMSw-Nr8kuR9pAHN1yhfBCkxvW/exec';

        let idFilesArray = [];
        let supportFilesArray = [];

        // Stack files for ID input
        document.getElementById('idUpload').addEventListener('change', function () {
            Array.from(this.files).forEach(file => idFilesArray.push(file));
            this.value = '';
            renderFileList('idFileList', idFilesArray, removeIdFile);
        });

        // Stack files for Support input
        document.getElementById('supportUpload').addEventListener('change', function () {
            Array.from(this.files).forEach(file => supportFilesArray.push(file));
            this.value = '';
            renderFileList('supportFileList', supportFilesArray, removeSupportFile);
        });

        function renderFileList(containerId, fileArray, removeCallback) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            fileArray.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';

                const fileNameSpan = document.createElement('span');
                fileNameSpan.textContent = `${index + 1}. ${file.name}`;

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'remove-file-btn';
                removeBtn.innerHTML = '&#10005;';
                removeBtn.onclick = () => removeCallback(index);

                item.appendChild(fileNameSpan);
                item.appendChild(removeBtn);
                container.appendChild(item);
            });
        }

        function removeIdFile(index) {
            idFilesArray.splice(index, 1);
            renderFileList('idFileList', idFilesArray, removeIdFile);
        }

        function removeSupportFile(index) {
            supportFilesArray.splice(index, 1);
            renderFileList('supportFileList', supportFilesArray, removeSupportFile);
        }

        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();

            if (file.type === 'application/pdf') {
                reader.onload = () => resolve({ name: file.name, data: reader.result });
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
                return;
            }

            reader.onload = e => {
                const img = new Image();

                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000;
                    const MAX_HEIGHT = 1000;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    resolve({
                        name: file.name.replace(/\.[^/.]+$/, "") + ".jpg",
                        data: compressedDataUrl
                    });
                };
                img.onerror = error => reject(error);
                img.src = e.target.result;
            };
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });

        // Generates the popup details using pre-calculated fullName
        function showSummaryModal(data) {
            const container = document.getElementById('summaryDetails');

            const plan = (data.plan || '').toString().trim().toUpperCase();
            const agentName = (data.agentName || '').toString().trim().toUpperCase();
            const fullName = (data.fullName || 'N/A').toString().trim().toUpperCase();

            container.innerHTML = `
                <div class="section-title">Subscription Details</div>
                <div class="detail-row"><strong>Plan:</strong> ${plan}</div>
                <div class="detail-row"><strong>Agent Name:</strong> ${agentName}</div>

                <div class="section-title">Personal Details</div>
                <div class="detail-row"><strong>Full Name:</strong> ${fullName}</div>
            `;

            document.getElementById('summaryModal').style.display = 'flex';
        }

        document.getElementById('appForm').addEventListener('reset', function () {
            idFilesArray = [];
            supportFilesArray = [];
            renderFileList('idFileList', idFilesArray, removeIdFile);
            renderFileList('supportFileList', supportFilesArray, removeSupportFile);
        });

        function closeSummaryModal() {
            document.getElementById('summaryModal').style.display = 'none';
            document.getElementById('appForm').reset();
        }

        document.getElementById('appForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            if (idFilesArray.length === 0) {
                alert('Please upload at least one Valid ID document.');
                return;
            }
            if (supportFilesArray.length === 0) {
                alert('Please upload at least one Supporting document.');
                return;
            }

            const submitBtn = document.querySelector('.submit');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing & Submitting...';

            try {
                // Compute summary modal full name logic directly prior to payload creation
                const firstName = document.getElementById('firstName').value.trim();
                const middleName = document.getElementById('middleName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                
                const nameParts = [firstName, middleName, lastName].filter(part => part.length > 0);
                const combinedFullName = nameParts.join(' ').toUpperCase();

                const idFiles = await Promise.all(idFilesArray.map(fileToBase64));
                const supportFiles = await Promise.all(supportFilesArray.map(fileToBase64));

                const formData = {
                    fullName: combinedFullName,
                    plan: document.getElementById('plan').value,
                    agentName: document.getElementById('agentName').value,
                    firstName: firstName,
                    middleName: middleName,
                    lastName: lastName,
                    email: document.getElementById('email').value,
                    address: document.getElementById('address').value,
                    barangay: document.getElementById('barangay').value,
                    city: document.getElementById('city').value,
                    province: document.getElementById('province').value,
                    landmark: document.getElementById('landmark').value,
                    idFiles: idFiles,
                    supportFiles: supportFiles
                };

                const payload = 'data=' + encodeURIComponent(JSON.stringify(formData));

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: payload
                });

                showSummaryModal(formData);

            } catch (err) {
                alert('An error occurred during submission: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Application';
            }
        });
    </script>
</body>

</html>
